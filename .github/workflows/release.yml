name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Ensure submodules full history
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=0
      - name: Install Qt from system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            qtmultimedia5-dev \
            libqt5charts5-dev \
            libssl-dev \
            libicu70 \
            qml-module-qtcharts \
            qml-module-qtquick2 \
            qml-module-qt-labs-platform \
            qml-module-qt-labs-folderlistmodel \
            qml-module-qt-labs-settings \
            qml-module-qt-labs-sharedimage
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build build -j
      - name: Install to staging
        run: cmake --install build --prefix "$PWD/stage"
      - name: Create Release AppImage
        run: |
          chmod +x ./tools/create_appimage.sh
          ./tools/create_appimage.sh --mode ci
          ls -la *.AppImage
          file *.AppImage
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-x86_64.AppImage
          path: Daqster-x86_64.AppImage
          if-no-files-found: error

  build-release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Qt (5.15.2)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          modules: 'qtcharts'
      - name: Install Ninja
        run: |
          choco install ninja -y
      - name: Configure (Release)
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
      - name: Build (Release)
        run: |
          cmake --build build --config Release -j
      - name: Install to staging
        run: |
          cmake --install build --prefix "${{ github.workspace }}\\stage-win"
      - name: Bundle Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $stage = "${{ github.workspace }}\stage-win"
          Copy-Item "$env:Qt5_Dir\bin\Qt5*.dll" -Destination "$stage\bin" -Force
          $mingwRuntime = @("libstdc++-6.dll","libgcc_s_seh-1.dll","libwinpthread-1.dll")
          foreach ($dll in $mingwRuntime) {
            $src = Join-Path "$env:Qt5_Dir\bin" $dll
            if (Test-Path $src) { Copy-Item $src -Destination "$stage\bin" -Force }
          }
          $destPlatforms = "$stage\bin\platforms"
          New-Item -ItemType Directory -Path $destPlatforms -Force | Out-Null
          Copy-Item "$env:Qt5_Dir\plugins\platforms\*.dll" -Destination $destPlatforms -Force
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\stage-win\*" -DestinationPath "${{ github.workspace }}\Daqster-Windows-x86_64.zip"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-Windows-x86_64.zip
          path: Daqster-Windows-x86_64.zip
          if-no-files-found: error

  create-release:
    needs: [build-release-linux, build-release-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: Daqster-x86_64.AppImage
      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: Daqster-Windows-x86_64.zip
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Daqster-x86_64.AppImage
            Daqster-Windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
