name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  # ============================================================
  # PRIMARY: Linux Qt6 — full pipeline: build + tests + AppImage + smoke
  # ============================================================
  linux-qt6:
    name: Linux Qt6 (primary)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule gitlinks are reachable
        run: |
          git submodule foreach 'git ls-remote origin | grep -q $(git rev-parse HEAD) || exit 1'

      # ubuntu-24.04 (noble) is required: qt6-charts-dev does not exist in
      # jammy (22.04). qt6-quickcontrols2-dev is not a noble package — Quick
      # Controls 2 ships inside qt6-declarative-dev. The Qt6 SVG dev package
      # is named qt6-svg-dev (libqt6svg6-dev does not exist in noble).
      # GStreamer plugin runtimes are needed by the Qt6Multimedia backend
      # (GStreamer on Qt 6.4) for the video-output tests.
      - name: Install Qt6 + gstreamer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-multimedia-dev \
            qt6-charts-dev \
            qt6-declarative-dev \
            qt6-svg-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libssl-dev

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDAQSTER_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: |
          cmake --build build -j

      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

      - name: Install to staging
        run: |
          sudo cmake --install build --prefix "$PWD/stage"

      - name: Create AppImage
        run: |
          chmod +x ./tools/create_appimage.sh
          ./tools/create_appimage.sh --mode ci
          ls -la *.AppImage
          file *.AppImage

      - name: Smoke test AppImage (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 15 ./Daqster-x86_64.AppImage --appimage-extract-and-run > appimage-smoke.log 2>&1
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "Smoke test PASSED: app ran for the full 15s timeout without crashing"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "Smoke test PASSED: app started and exited cleanly"
          else
            echo "Smoke test FAILED: AppImage exited with code $EXIT_CODE"
            cat appimage-smoke.log
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-Linux-Qt6-x86_64.AppImage
          path: Daqster-x86_64.AppImage
          if-no-files-found: error

  # ============================================================
  # COMPAT: Linux Qt5 — build + tests (no packaging)
  # ============================================================
  linux-qt5:
    name: Linux Qt5 (compat)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule gitlinks are reachable
        run: |
          git submodule foreach 'git ls-remote origin | grep -q $(git rev-parse HEAD) || exit 1'

      # All Qt5 packages exist in noble (5.15.13). libicu70 is jammy-only —
      # noble ships libicu74. GStreamer RUNTIME packages (not just dev) are
      # required: the Qt5Multimedia backend is GStreamer and the video-output
      # tests fail at runtime without the plugins.
      - name: Install Qt5 from system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            qtmultimedia5-dev \
            libqt5charts5-dev \
            libssl-dev \
            libqt5opengl5-dev \
            libicu74 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            qml-module-qtcharts \
            qml-module-qtquick2 \
            qml-module-qt-labs-platform \
            qml-module-qt-labs-folderlistmodel \
            qml-module-qt-labs-settings \
            qml-module-qt-labs-sharedimage

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDAQSTER_BUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build -j

      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

  # ============================================================
  # PRIMARY: Windows Qt6 — build + tests + windeployqt ZIP + smoke
  # Compiler: MSVC 2022 (win64_msvc2022_64). Qt ships official MSVC
  # binaries for every 6.x release and VS 2022 is preinstalled on
  # windows-latest, so this avoids the MinGW ABI-mismatch risk
  # (Qt's MinGW build must match the exact MinGW toolchain version).
  # ============================================================
  windows-qt6:
    name: Windows Qt6 (primary)
    runs-on: windows-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule gitlinks are reachable
        shell: bash
        run: |
          git submodule foreach 'git ls-remote origin | grep -q $(git rev-parse HEAD) || exit 1'

      # aqtinstall fails when a "module" is not an add-on module for the
      # version/arch. For 6.8.3 win64_msvc2022_64, qtdeclarative and qtsvg
      # are part of the BASE package (verified: aqt list-qt --archives shows
      # qtbase qtdeclarative qtsvg qttools qttranslations) — passing them as
      # modules makes aqt exit 1. Only qtcharts and qtmultimedia are real
      # add-on modules for this version/arch.
      - name: Install Qt6 (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtmultimedia'

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DDAQSTER_BUILD_TESTS=ON

      - name: Build (Release)
        run: |
          cmake --build build --config Release -j

      - name: Run tests (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build -C Release --output-on-failure

      - name: Install to staging
        run: |
          cmake --install build --config Release --prefix "${{ github.workspace }}\stage-win"

      - name: Bundle Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $qtDir = if ($env:Qt6_Dir) { $env:Qt6_Dir } elseif ($env:Qt6_DIR) { $env:Qt6_DIR } else { throw "Qt6_Dir not set" }
          Write-Host "Qt6 dir: $qtDir"
          $stage = "${{ github.workspace }}\stage-win"
          & "$qtDir\bin\windeployqt.exe" --release --no-translations --compiler-runtime "$stage\bin\Daqster.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

      - name: Smoke test (launch exe)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $stage = "${{ github.workspace }}\stage-win"
          $proc = Start-Process -FilePath "$stage\bin\Daqster.exe" -PassThru
          if ($proc.WaitForExit(15000)) {
            if ($proc.ExitCode -eq 0) {
              Write-Host "Smoke test PASSED: app started and exited cleanly"
            } else {
              Write-Host "Smoke test FAILED: exit code $($proc.ExitCode)"
              exit 1
            }
          } else {
            Write-Host "Smoke test PASSED: app ran for 15s without crashing"
            Stop-Process -Id $proc.Id -Force
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\stage-win\*" -DestinationPath "${{ github.workspace }}\Daqster-Windows-x86_64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-Windows-x86_64
          path: Daqster-Windows-x86_64.zip
          if-no-files-found: error