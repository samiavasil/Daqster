name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  # ============================================================
  # PRIMARY: Linux Qt6 — full pipeline: build + tests + AppImage + smoke
  # ============================================================
  linux-qt6:
    name: Linux Qt6 (primary)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule gitlinks are reachable
        run: |
          git submodule foreach 'git ls-remote origin | grep -q $(git rev-parse HEAD) || exit 1'

      # System Qt on ubuntu-24.04 is 6.4.2 — too old for the codebase
      # (QVideoFrame(QImage) ctor needs 6.8+, QImage::flipped() needs 6.9+).
      # Install Qt 6.8.3 via aqtinstall (like the Windows job) instead.
      # The Linux desktop arch for Qt 6.7+ is "linux_gcc_64" — the older
      # "gcc_64" name makes aqt fail with "packages were not found while
      # parsing XML of package information".
      # For 6.8.3 linux_gcc_64, qtdeclarative and qtsvg are part of the BASE
      # package (verified: aqt list-qt --archives shows icu qtbase qtdeclarative
      # qtsvg qttools qttranslations qtwayland) — passing them as modules makes
      # aqt exit 1. Only qtcharts and qtmultimedia are real add-on modules.
      # GStreamer dev + runtime packages are still needed by the Qt6Multimedia
      # backend for the video-output tests. Mesa GL libs provide offscreen GL
      # (llvmpipe) so the video-output tests can create a GL context headlessly.
      - name: Install system deps (gstreamer, GL, ssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libgl1-mesa-dri \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libssl-dev

      - name: Install Qt 6.8.3 (aqtinstall)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtcharts qtmultimedia'

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDAQSTER_BUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        run: |
          cmake --build build -j

      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

      - name: Install to staging
        run: |
          sudo cmake --install build --prefix "$PWD/stage"

      - name: Create AppImage
        run: |
          chmod +x ./tools/create_appimage.sh
          QT_DIR="$QT_ROOT_DIR" ./tools/create_appimage.sh --mode ci
          ls -la *.AppImage
          file *.AppImage

      - name: Smoke test AppImage (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          timeout 15 ./Daqster-x86_64.AppImage --appimage-extract-and-run > appimage-smoke.log 2>&1
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 124 ]; then
            echo "Smoke test PASSED: app ran for the full 15s timeout without crashing"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "Smoke test PASSED: app started and exited cleanly"
          else
            echo "Smoke test FAILED: AppImage exited with code $EXIT_CODE"
            cat appimage-smoke.log
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-Linux-Qt6-x86_64.AppImage
          path: Daqster-x86_64.AppImage
          if-no-files-found: error

  # ============================================================
  # COMPAT: Linux Qt5 — build + tests (no packaging)
  # ============================================================
  linux-qt5:
    name: Linux Qt5 (compat)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule gitlinks are reachable
        run: |
          git submodule foreach 'git ls-remote origin | grep -q $(git rev-parse HEAD) || exit 1'

      # All Qt5 packages exist in noble (5.15.13). libicu70 is jammy-only —
      # noble ships libicu74. GStreamer RUNTIME packages (not just dev) are
      # required: the Qt5Multimedia backend is GStreamer and the video-output
      # tests fail at runtime without the plugins. Mesa GL libs provide
      # offscreen GL (llvmpipe) so the video-output tests can create a GL
      # context headlessly (without them QOpenGLContext::create() fails and
      # the GL fallback path is exercised instead).
      - name: Install Qt5 from system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            qtmultimedia5-dev \
            libqt5charts5-dev \
            libssl-dev \
            libqt5opengl5-dev \
            libicu74 \
            libgl1-mesa-dri \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            qml-module-qtcharts \
            qml-module-qtquick2 \
            qml-module-qt-labs-platform \
            qml-module-qt-labs-folderlistmodel \
            qml-module-qt-labs-settings \
            qml-module-qt-labs-sharedimage

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDAQSTER_BUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build -j

      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

  # ============================================================
  # PRIMARY: Windows Qt6 — build + tests + windeployqt ZIP + smoke
  # Compiler: MSVC 2022 (win64_msvc2022_64). Qt ships official MSVC
  # binaries for every 6.x release and VS 2022 is preinstalled on
  # windows-latest, so this avoids the MinGW ABI-mismatch risk
  # (Qt's MinGW build must match the exact MinGW toolchain version).
  # ============================================================
  windows-qt6:
    name: Windows Qt6 (primary)
    runs-on: windows-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule gitlinks are reachable
        shell: bash
        run: |
          git submodule foreach 'git ls-remote origin | grep -q $(git rev-parse HEAD) || exit 1'

      # aqtinstall fails when a "module" is not an add-on module for the
      # version/arch. For 6.8.3 win64_msvc2022_64, qtdeclarative and qtsvg
      # are part of the BASE package (verified: aqt list-qt --archives shows
      # qtbase qtdeclarative qtsvg qttools qttranslations) — passing them as
      # modules makes aqt exit 1. Only qtcharts and qtmultimedia are real
      # add-on modules for this version/arch.
      - name: Install Qt6 (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtcharts qtmultimedia'

      # The VS generator ("Visual Studio 17 2022") failed to find a VS instance
      # on windows-latest ("could not find any instance of Visual Studio" at
      # project()). The robust fix: set up the MSVC environment explicitly with
      # msvc-dev-cmd and use the Ninja generator (preinstalled on the runner).
      # Ninja + MSVC avoids VS instance discovery entirely and works with
      # WINDOWS_EXPORT_ALL_SYMBOLS (frame_work / qtrest_lib).
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDAQSTER_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build (Release)
        run: |
          cmake --build build -j

      - name: Run tests (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

      - name: Install to staging
        run: |
          cmake --install build --prefix "${{ github.workspace }}\stage-win"

      - name: Bundle Qt runtime (windeployqt)
        shell: pwsh
        run: |
          $qtDir = $env:QT_ROOT_DIR
          if (-not $qtDir) { throw "QT_ROOT_DIR not set" }
          Write-Host "Qt6 dir: $qtDir"
          $stage = "${{ github.workspace }}\stage-win"
          & "$qtDir\bin\windeployqt.exe" --release --no-translations --compiler-runtime "$stage\bin\Daqster.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed with exit code $LASTEXITCODE" }

      - name: Smoke test (launch exe)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $stage = "${{ github.workspace }}\stage-win"
          $proc = Start-Process -FilePath "$stage\bin\Daqster.exe" -PassThru
          if ($proc.WaitForExit(15000)) {
            if ($proc.ExitCode -eq 0) {
              Write-Host "Smoke test PASSED: app started and exited cleanly"
            } else {
              Write-Host "Smoke test FAILED: exit code $($proc.ExitCode)"
              exit 1
            }
          } else {
            Write-Host "Smoke test PASSED: app ran for 15s without crashing"
            Stop-Process -Id $proc.Id -Force
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\stage-win\*" -DestinationPath "${{ github.workspace }}\Daqster-Windows-x86_64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-Windows-x86_64
          path: Daqster-Windows-x86_64.zip
          if-no-files-found: error