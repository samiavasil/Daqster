name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  # ============================================================
  # PRIMARY: Linux Qt6 — full pipeline: build + tests + AppImage + smoke
  # Implemented by the shared reusable workflow (build-qt6.yml).
  # ============================================================
  linux-qt6:
    name: Linux Qt6 (primary)
    uses: ./.github/workflows/build-qt6.yml
    with:
      platform: 'linux'
      upload-artifact-name: 'Daqster-Linux-Qt6-x86_64.AppImage'
      verify-qt-version: true
      export-compile-commands: true

  # ============================================================
  # COMPAT: Linux Qt5 — build + tests (no packaging)
  # ============================================================
  linux-qt5:
    name: Linux Qt5 (compat)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule gitlinks are reachable
        run: |
          git submodule foreach 'git ls-remote origin | grep -q $(git rev-parse HEAD) || exit 1'

      # All Qt5 packages exist in noble (5.15.13). libicu70 is jammy-only —
      # noble ships libicu74. GStreamer RUNTIME packages (not just dev) are
      # required: the Qt5Multimedia backend is GStreamer and the video-output
      # tests fail at runtime without the plugins. Mesa GL libs provide
      # offscreen GL (llvmpipe) so the video-output tests can create a GL
      # context headlessly (without them QOpenGLContext::create() fails and
      # the GL fallback path is exercised instead).
      - name: Install Qt5 from system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            qtmultimedia5-dev \
            libqt5charts5-dev \
            libqt5websockets5-dev \
            libssl-dev \
            libqt5opengl5-dev \
            libicu74 \
            libgl1-mesa-dri \
            libegl1 \
            libgl1 \
            libglx-mesa0 \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            qml-module-qtcharts \
            qml-module-qtquick2 \
            qml-module-qt-labs-platform \
            qml-module-qt-labs-folderlistmodel \
            qml-module-qt-labs-settings \
            qml-module-qt-labs-sharedimage

      - name: Configure (Release, tests ON)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDAQSTER_BUILD_TESTS=ON

      - name: Build
        run: |
          cmake --build build -j

      - name: Run tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

  # ============================================================
  # PRIMARY: Windows Qt6 — build + tests + windeployqt ZIP + smoke
  # Implemented by the shared reusable workflow (build-qt6.yml).
  # ============================================================
  windows-qt6:
    name: Windows Qt6 (primary)
    uses: ./.github/workflows/build-qt6.yml
    with:
      platform: 'windows'
      upload-artifact-name: 'Daqster-Windows-x86_64'