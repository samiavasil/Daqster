name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Ensure submodules full history
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=0
      
      - name: Install Qt from system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            qtmultimedia5-dev \
            libqt5charts5-dev \
            libssl-dev \
            libqt5opengl5-dev \
            libicu70 \
            qml-module-qtcharts \
            qml-module-qtquick2 \
            qml-module-qt-labs-platform \
            qml-module-qt-labs-folderlistmodel \
            qml-module-qt-labs-settings \
            qml-module-qt-labs-sharedimage
      
      - name: Debug Qt installation
        run: |
          echo "Qt installation debug info:"
          echo "PATH: $PATH"
          
          # Set Qt environment
          export QT_DIR="$HOME/Qt/5.15.2/gcc_64"
          export PATH="$HOME/.local/bin:$QT_DIR/bin:$PATH"
          export LD_LIBRARY_PATH="$QT_DIR/lib:$LD_LIBRARY_PATH"
          
          which qmake || echo "qmake not found"
          which qtpaths || echo "qtpaths not found"
          
          # Check Qt version
          qmake --version || echo "qmake version not available"
          
          # Check Qt paths
          qmake -query QT_INSTALL_PREFIX || echo "QT_INSTALL_PREFIX not available"
          qmake -query QT_INSTALL_LIBS || echo "QT_INSTALL_LIBS not available"
          qmake -query QT_INSTALL_QML || echo "QT_INSTALL_QML not available"
          qmake -query QT_INSTALL_PLUGINS || echo "QT_INSTALL_PLUGINS not available"
          
          # Check available Qt modules
          echo "Checking Qt modules:"
          ls -la "$QT_DIR/qml/" || echo "QML modules not found"
          ls -la "$QT_DIR/plugins/" || echo "Qt plugins not found"
      
      - name: Configure (Release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      
      - name: Fix qtrest install for staging
        run: |
          # Upstream qtrest hardcodes Windows-only .dll/.lib install rules
          # with absolute DESTINATION paths. Remove those blocks entirely
          # and fix the header install to use CMAKE_INSTALL_PREFIX.
          python3 << 'PYEOF'
import re
path = "build/src/external_libs/qtrest_lib/qtrest/core/cmake_install.cmake"
with open(path) as f:
    lines = f.readlines()
output = []
skip_until = -1
for i, line in enumerate(lines):
    if i < skip_until:
        continue
    if re.search(r'\bif\s*\(', line):
        block = ''
        endif_idx = -1
        depth = 0
        for j in range(i, len(lines)):
            block += lines[j]
            depth += len(re.findall(r'(?<!e)\bif\s*\(', lines[j])) - lines[j].count('endif()')
            if 'endif()' in lines[j] and depth <= 0:
                endif_idx = j
                break
        if endif_idx >= 0 and ('qtrest.dll' in block or 'qtrest.lib' in block):
            skip_until = endif_idx + 1
            continue
    line = line.replace('"/usr/local/include/qtrest"', '"${CMAKE_INSTALL_PREFIX}/include/qtrest"')
    output.append(line)
with open(path, 'w') as f:
    f.writelines(output)
print("Patched:", path)
PYEOF
      
      - name: Build (Release)
        run: |
          cmake --build build -j
          
      - name: Configure (Debug)
        run: |
          cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug
      
      - name: Fix qtrest install for staging (Debug)
        run: |
          python3 << 'PYEOF'
import re
path = "build-debug/src/external_libs/qtrest_lib/qtrest/core/cmake_install.cmake"
with open(path) as f:
    lines = f.readlines()
output = []
skip_until = -1
for i, line in enumerate(lines):
    if i < skip_until:
        continue
    if re.search(r'\bif\s*\(', line):
        block = ''
        endif_idx = -1
        depth = 0
        for j in range(i, len(lines)):
            block += lines[j]
            depth += len(re.findall(r'(?<!e)\bif\s*\(', lines[j])) - lines[j].count('endif()')
            if 'endif()' in lines[j] and depth <= 0:
                endif_idx = j
                break
        if endif_idx >= 0 and ('qtrest.dll' in block or 'qtrest.lib' in block):
            skip_until = endif_idx + 1
            continue
    line = line.replace('"/usr/local/include/qtrest"', '"${CMAKE_INSTALL_PREFIX}/include/qtrest"')
    output.append(line)
with open(path, 'w') as f:
    f.writelines(output)
print("Patched:", path)
PYEOF
      
      - name: Build (Debug)
        run: |
          cmake --build build-debug -j
      
      - name: Install to staging (Release)
        run: |
          cmake --install build --prefix "$PWD/stage"
          
      - name: Install to staging (Debug)
        run: |
          cmake --install build-debug --prefix "$PWD/stage-debug"
      
      - name: Create Release AppImage
        run: |
          # Make script executable and use our unified AppImage creation script in CI mode
          chmod +x ./tools/create_appimage.sh
          ./tools/create_appimage.sh --mode ci
          
      - name: Create Debug AppImage
        run: |
          # Create debug AppImage using similar approach as release
          mkdir -p Daqster-Debug.AppDir/{usr/{bin,lib,share},usr/share/applications,usr/share/icons/hicolor/256x256/apps}
          mkdir -p Daqster-Debug.AppDir/usr/lib/{plugins,qml,daqster/plugins}
          
          # Copy debug executable
          cp stage-debug/bin/Daqster Daqster-Debug.AppDir/usr/bin/
          
          # Copy libraries
          cp -r stage-debug/lib/* Daqster-Debug.AppDir/usr/lib/
          
          # Copy plugins to correct location
          cp -r stage-debug/bin/plugins/* Daqster-Debug.AppDir/usr/lib/daqster/plugins/ || true
          
          # Copy Qt libraries and modules from system
          cp -r /usr/lib/x86_64-linux-gnu/libQt5* Daqster-Debug.AppDir/usr/lib/ || true
          cp -r /usr/lib/x86_64-linux-gnu/qt5/plugins/* Daqster-Debug.AppDir/usr/lib/plugins/ || true
          cp -r /usr/lib/x86_64-linux-gnu/qt5/qml/* Daqster-Debug.AppDir/usr/lib/qml/ || true
          
          # Copy ICU libraries (required by Qt)
          cp /usr/lib/x86_64-linux-gnu/libicu*.so.* Daqster-Debug.AppDir/usr/lib/ || true
          
          # Create debug icon
          convert -size 256x256 xc:lightblue -pointsize 20 -fill black -gravity center -annotate +0+0 "Daqster\nDebug" Daqster-Debug.AppDir/daqster.png || echo "Icon creation failed, continuing without icon"
          cp Daqster-Debug.AppDir/daqster.png Daqster-Debug.AppDir/usr/share/icons/hicolor/256x256/apps/
          
          # Create desktop file
          cat > Daqster-Debug.AppDir/daqster.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Daqster Debug
          Comment=Data Acquisition and Analysis Tool - Debug Version
          Exec=daqster
          Icon=daqster
          Categories=Development;Science;
          Terminal=false
          StartupNotify=true
          EOF
          
          # Also create in usr/share/applications
          cp Daqster-Debug.AppDir/daqster.desktop Daqster-Debug.AppDir/usr/share/applications/
          
          # Create AppRun script (same as release)
          cat > Daqster-Debug.AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          
          # Set library paths
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          
          # Set Qt paths
          export QML2_IMPORT_PATH="${HERE}/usr/lib/qml:${QML2_IMPORT_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/lib/plugins:${QT_PLUGIN_PATH}"
          export QT_QPA_PLATFORM_PLUGIN_PATH="${HERE}/usr/lib/plugins/platforms"
          
          # Set plugin paths
          export DAQSTER_PLUGIN_DIR="${HERE}/usr/lib/daqster/plugins"
          export DAQSTER_PLUGIN_PATH="${HERE}/usr/lib/daqster/plugins:${HOME}/.local/share/daqster/plugins"
          
          # Writable directories (outside AppImage)
          export XDG_CONFIG_HOME="${HOME}/.config/daqster"
          export XDG_DATA_HOME="${HOME}/.local/share/daqster"
          export XDG_CACHE_HOME="${HOME}/.cache/daqster"
          
          # Create directories
          mkdir -p "${XDG_CONFIG_HOME}"
          mkdir -p "${XDG_DATA_HOME}"
          mkdir -p "${XDG_CACHE_HOME}"
          
          # Start application
          exec "${HERE}/usr/bin/Daqster" "$@"
          EOF
          
          chmod +x Daqster-Debug.AppDir/AppRun
          
          # Create Debug AppImage using extracted tool
          ./squashfs-root/AppRun Daqster-Debug.AppDir Daqster-Debug-x86_64.AppImage
          
          # Check Debug AppImage
          file Daqster-Debug-x86_64.AppImage
          ls -la Daqster-Debug-x86_64.AppImage
      
      - name: Upload AppImages
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-AppImages
          path: |
            Daqster-x86_64.AppImage
            Daqster-Debug-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt (5.15.2)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          # Use MinGW toolchain to match the default compiler
          # (C:\mingw64\bin\c++.exe) used by CMake/Ninja in CI.
          # This avoids ABI mismatches between MSVC-built Qt and
          # MinGW binaries.
          arch: 'win64_mingw81'
          # Install Qt Charts explicitly; other optional modules
          # (Qml, Quick, QuickControls2, Multimedia, Network) are
          # detected at CMake time and missing ones will simply
          # disable the corresponding plugins instead of failing
          # the entire build.
          modules: 'qtcharts'

      - name: Install Ninja
        run: |
          choco install ninja -y

      - name: Configure (Release)
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        run: |
          cmake --build build --config Release -j

      - name: Install to staging (Release)
        run: |
          cmake --install build --prefix "${{ github.workspace }}\\stage-win"

      - name: Bundle Qt runtime (windeployqt)
        shell: pwsh
        run: |
          # Show where Qt is installed and whether the platform plugin exists
          Write-Host "Qt5_Dir=$env:Qt5_Dir"
          Write-Host "Qt plugins dir: $env:Qt5_Dir\plugins"
          Write-Host "Qt platforms dir contents:"
          Get-ChildItem "$env:Qt5_Dir\plugins\platforms" -ErrorAction SilentlyContinue || Write-Host "No platforms directory found"

          # Remove any pre-existing Qt plugin/QML paths from the environment
          # that might confuse the deployed application.
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue

          # Ensure Qt binaries are on PATH so that the deployed application
          # uses the correct Qt runtime.
          $env:PATH = "$env:Qt5_Dir\bin;${env:PATH}"

          # Manually copy the core Qt runtime and MinGW runtime DLLs, plus the
          # platform plugins, into the staging tree. This avoids relying on
          # windeployqt, which can be fragile in headless CI.
          $stage = "${{ github.workspace }}\stage-win"

          # Core Qt DLLs (Qt5Core/Gui/Widgets and friends)
          Copy-Item "$env:Qt5_Dir\bin\Qt5*.dll" -Destination "$stage\bin" -Force

          # MinGW runtime DLLs commonly required by Qt MinGW builds
          $mingwRuntime = @(
            "libstdc++-6.dll",
            "libgcc_s_seh-1.dll",
            "libwinpthread-1.dll"
          )
          foreach ($dll in $mingwRuntime) {
            $src = Join-Path "$env:Qt5_Dir\bin" $dll
            if (Test-Path $src) {
              Copy-Item $src -Destination "$stage\bin" -Force
            } else {
              Write-Host "Optional runtime DLL not found: $dll"
            }
          }

          # Platform plugins (qwindows, qminimal, qoffscreen, etc.) under
          # bin\platforms so that Qt can locate them next to the executable.
          $destPlatforms = "$stage\bin\platforms"
          New-Item -ItemType Directory -Path $destPlatforms -Force | Out-Null
          Copy-Item "$env:Qt5_Dir\plugins\platforms\*.dll" -Destination $destPlatforms -Force

          # Try to locate and bundle the NodeEditor runtime DLL (libnodes.dll)
          # so that NodeEditorPlugin can be loaded on Windows.
          $nodesDll = Get-ChildItem "${{ github.workspace }}" -Recurse -Filter "libnodes.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nodesDll) {
            Write-Host "Found libnodes.dll at: $($nodesDll.FullName)"
            Copy-Item $nodesDll.FullName -Destination "$stage\\bin" -Force
          } else {
            Write-Host "libnodes.dll not found; NodeEditorPlugin may not load at runtime."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\stage-win\*" -DestinationPath "${{ github.workspace }}\Daqster-Windows-x86_64.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Daqster-Windows-x86_64
          path: Daqster-Windows-x86_64.zip
