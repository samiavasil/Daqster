name: DeepSource

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  analyze:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtbase5-dev \
            qtdeclarative5-dev \
            qtquickcontrols2-5-dev \
            qtmultimedia5-dev \
            libqt5charts5-dev \
            libssl-dev

      - name: Generate compile_commands.json
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build project
        run: |
          cmake --build build -j

      - name: Verify compile_commands.json
        run: |
          if [ ! -s build/compile_commands.json ]; then
            echo "ERROR: compile_commands.json missing or empty"
            exit 1
          fi
          echo "compile_commands.json generated successfully"
          echo "Entry count: $(python3 -c 'import json,sys; print(len(json.load(open("build/compile_commands.json"))))' 2>/dev/null || echo 'unknown')"

      - name: Report compile_commands.json to DeepSource
        if: env.DEEPSOURCE_DSN != ''
        run: |
          curl -sSfL https://deepsource.io/cli | sh
          ./bin/deepsource report --analyzer cxx --key compile-commands --value-file build/compile_commands.json
