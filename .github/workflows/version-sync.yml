name: Version Sync Check

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "Expected version (from VERSION): $VERSION"
          FAIL=0

          check() {
            local file="$1" pattern="$2"
            if [ ! -f "$file" ]; then
              echo "MISSING: $file not found"
              FAIL=1
              return
            fi
            if ! grep -qE "$pattern" "$file"; then
              echo "MISMATCH: $file does not contain version $VERSION"
              FAIL=1
            fi
          }

          check CMakeLists.txt "project\(Daqster VERSION $VERSION"
          check src/plugins/demo_nodeditor_nodes/CMakeLists.txt "project\(demo_nodeditor_nodes VERSION $VERSION"
          check src/plugins/node_editor_ide/CMakeLists.txt "project\(node_editor_ide VERSION $VERSION"
          check src/plugins/requirements_manager/CMakeLists.txt "project\(requirements_manager VERSION $VERSION"
          check src/plugins/demo_nodeditor_nodes/DemoNodeEditorNodesInterface.json "\"Version\": \"$VERSION\""
          check src/plugins/node_editor_ide/NodeEditorIdeInterface.json "\"Version\": \"$VERSION\""
          check src/plugins/requirements_manager/RequirementsManagerInterface.json "\"Version\": \"$VERSION\""
          check src/plugins/demo_nodeditor_nodes/DemoNodeEditorNodesInterface.cpp "PLUGIN_VERSION, \"$VERSION\""
          check src/plugins/node_editor_ide/NodeEditorIdeInterface.cpp "PLUGIN_VERSION, \"$VERSION\""
          check src/plugins/requirements_manager/RequirementsManagerInterface.cpp "PLUGIN_VERSION, \"$VERSION\""
          check docs/plugins/demo_nodeditor_nodes/README.md "PLUGIN_VERSION    = \"$VERSION\""
          check docs/plugins/node_editor_ide/README.md "PLUGIN_VERSION    = \"$VERSION\""
          check CHANGELOG.md "^## \[$VERSION\]"
          check CHANGELOG.en.md "^## \[$VERSION\]"

          if [ "$FAIL" -ne 0 ]; then
            echo ""
            echo "Version drift detected. Run ./scripts/version.sh $VERSION to sync all locations."
            exit 1
          fi
          echo "All version locations match VERSION ($VERSION)."